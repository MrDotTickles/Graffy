name: Public release safety
on:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Scan complete Git history for credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
          mkdir /tmp/graffy-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/graffy-gitleaks
          /tmp/graffy-gitleaks/gitleaks git . --redact=100 --log-opts='--all' --ignore-gitleaks-allow --no-banner
      - name: Reject private files and credentials in the source
        run: python scripts/public_release_audit.py
      - name: Audit resolved dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-build.txt --strict --format json --output dependency-audit.json
